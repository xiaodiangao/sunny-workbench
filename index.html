<style>
:root {
  --bg: #F0EFED;
  --card: linear-gradient(145deg, #F7F6F3 0%, #EFEDE9 100%);
  --card-solid: #F4F3F0;
  --yellow: #FFDA80;
  --yellow-light: #FDE7BC;
  --yellow-deep: #FDC748;
  --text: #57534A;
  --text-soft: #A6A198;
  --line: rgba(140,134,120,0.14);
  --done: #AED581;
  --sidebar-w: 220px;
  --shadow: 7px 7px 18px rgba(163,157,140,0.28), -7px -7px 18px rgba(255,255,255,0.95);
  --shadow-sm: 4px 4px 10px rgba(163,157,140,0.22), -4px -4px 10px rgba(255,255,255,0.9);
  --inset: inset 3px 3px 7px rgba(163,157,140,0.22), inset -3px -3px 7px rgba(255,255,255,0.9);
  --glass-border: rgba(255,255,255,0.9);
  --period: #E57373;
  --period-light: #F8BBD0;
  --period-predict: #FCE4EC;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif;
  background:
    linear-gradient(150deg, #EFEEED 0%, #E9E7E6 55%, #EDEBEA 100%);
  background-attachment: fixed;
  color: var(--text);
  overflow: hidden;
}

/* ===== Layout ===== */
.app { display: flex; height: 100vh; height: 100dvh; position: relative; z-index: 1; }

/* ===== Decorative gradient orb (background) ===== */
body::before {
  content: '';
  position: fixed;
  width: 480px; height: 480px;
  left: calc(50% + 110px); top: 59%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(circle at 35% 30%, #FFF9DE 0%, #FDEBC8 35%, #FFDA80 72%, #FDC94E 98%);
  box-shadow: 0 0 110px 35px rgba(253,231,188,0.40);
  filter: blur(2px);
}

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: linear-gradient(180deg, #F3F2F0 0%, #ECEAE6 100%);
  box-shadow: 6px 0 18px rgba(163,157,140,0.15);
  border-right: none;
  display: flex; flex-direction: column;
  overflow-y: auto;
  z-index: 10;
}
.side-logo {
  padding: 18px 16px 10px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.side-logo:active { opacity: 0.65; }
.side-logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900; color: #FFF;
  box-shadow: 0 6px 14px rgba(255,196,0,0.35);
  flex-shrink: 0;
}
.side-title { font-size: 22px; font-weight: 900; color: #57534A; line-height: 1; }
.side-date { font-size: 11px; color: var(--text-soft); margin-top: 2px; font-weight: 700; }
.side-progress { padding: 6px 16px 12px; }
.side-progress-bar { height: 8px; background: #E7E5E1; border-radius: 8px; overflow: hidden; box-shadow: inset 2px 2px 4px rgba(163,157,140,0.25), inset -2px -2px 4px rgba(255,255,255,0.9); }
.side-progress-fill { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow-deep)); border-radius: 6px; transition: width 0.5s ease; }
.side-progress-txt { font-size: 11px; color: var(--text-soft); margin-top: 4px; font-weight: 700; }

.side-section { font-size: 10px; font-weight: 800; color: var(--text-soft); padding: 8px 16px 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.side-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 14px; font-weight: 700;
  color: var(--text);
  border-radius: 0;
  transition: all 0.15s;
  margin: 1px 8px;
  border-radius: 12px;
  position: relative;
}
.side-item:hover { background: rgba(255,255,255,0.6); }
.side-item.active { background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%); color: #6E5500; box-shadow: 0 8px 18px rgba(255,196,0,0.35); }
.side-item.done { color: var(--text-soft); }
.side-item.done .side-item-name { text-decoration: line-through; }
.side-item-icon {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.side-item-icon svg { width: 18px; height: 18px; display: block; }
.side-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item-badge {
  font-size: 10px; background: var(--done); color: #FFF;
  border-radius: 8px; padding: 1px 7px; font-weight: 800;
}
.side-spacer { flex: 0 0 10px; }
.side-nav { padding: 8px 8px 14px; border-top: 1.5px dashed var(--line); margin: 0 8px; }
.side-nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px; font-weight: 700;
  color: var(--text-soft);
  border-radius: 10px;
  transition: all 0.15s;
}
.side-nav-item:hover { background: rgba(255,255,255,0.6); color: var(--text); }
.side-nav-item.active { background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%); color: #6E5500; box-shadow: 0 8px 18px rgba(255,196,0,0.35); }
.side-nav-item svg { width: 18px; height: 18px; }

/* ===== Main ===== */
.main {
  flex: 1;
  overflow-y: auto;
  background: transparent;
  padding: 24px 28px;
  display: flex; flex-direction: column;
}
.main-panel { display: none; flex: 1; flex-direction: column; }
.main-panel.active { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.panel-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.panel-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.panel-icon svg { width: 28px; height: 28px; }
.panel-title { font-size: 22px; font-weight: 900; color: var(--text); }
.panel-sub { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
.panel-body { flex: 1; display: flex; flex-direction: column; gap: 14px; }

/* ===== Task detail panel ===== */
.task-detail-card {
  background: var(--card);
  border: none;
  border-radius: 20px;
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.task-detail-card label {
  display: block;
  font-size: 13px; font-weight: 700; color: var(--text);
  margin-bottom: 6px;
}
.task-detail-card input, .task-detail-card textarea {
  width: 100%;
  padding: 10px 14px;
  border: none;
  border-radius: 12px;
  font-size: 14px; font-family: inherit;
  background: #EFEEEA; color: var(--text);
  box-shadow: var(--inset);
  outline: none;
  transition: box-shadow 0.2s;
}
.task-detail-card input:focus, .task-detail-card textarea:focus { box-shadow: var(--inset), 0 0 0 2px rgba(255,211,25,0.45); }
.task-detail-card textarea { resize: vertical; min-height: 60px; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.btn {
  padding: 10px 18px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%);
  color: #7A5C00;
  font-weight: 800;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(255,196,0,0.30);
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(255,196,0,0.25); }
.btn.ghost { background: #F1F0ED; color: var(--text); border: none; box-shadow: var(--shadow-sm); }
.btn.done-btn { background: linear-gradient(135deg, #C5E1A5, #AED581); color: #33691E; box-shadow: 0 6px 14px rgba(174,213,129,0.35); }
.btn.undo-btn { background: rgba(255,255,255,0.55); color: var(--text-soft); box-shadow: none; }

/* ===== Welcome panel ===== */
.welcome { text-align: center; padding: 40px 20px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.welcome-emoji { font-size: 48px; margin-bottom: 12px; }
.welcome h2 { font-size: 20px; font-weight: 900; color: var(--text); margin: 0 0 6px; }
.welcome p { font-size: 14px; color: var(--text-soft); margin: 0; }

/* ===== History panel ===== */
.history-block { margin-top: 8px; }
.history-block-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
.history-card {
  background: var(--card);
  border: none;
  border-radius: 18px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 10px;
}
.history-head {
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.history-date { font-size: 14px; font-weight: 800; }
.history-summary { font-size: 12px; color: var(--text-soft); font-weight: 700; }
.history-toggle { font-size: 12px; color: var(--yellow-deep); transition: transform 0.2s; }
.history-card.open .history-toggle { transform: rotate(90deg); }
.history-body { display: none; padding: 0 16px 14px; border-top: 1.5px dashed var(--line); }
.history-card.open .history-body { display: block; }
.history-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.history-item:last-child { border-bottom: none; }
.history-item svg { width: 16px; height: 16px; }
.history-item .h-name { flex: 1; font-weight: 700; }
.history-item .h-value { color: var(--yellow-deep); font-weight: 800; }
.history-item.miss .h-name { color: var(--text-soft); text-decoration: line-through; }

/* ===== Stats panel ===== */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-box {
  background: var(--card);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  border: none;
  box-shadow: var(--shadow-sm);
}
.stat-num { font-size: 24px; font-weight: 900; color: var(--yellow-deep); line-height: 1; }
.stat-label { font-size: 11px; color: var(--text-soft); margin-top: 4px; font-weight: 700; }

.heat-row { display: flex; gap: 6px; margin-top: 8px; }
.heat-box {
  flex: 1; aspect-ratio: 1;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}

/* ===== Weight panel ===== */
.weight-entry { margin-bottom: 14px; }
.weight-entry label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.weight-entry input {
  width: 100%; padding: 10px 14px;
  border: none;
  border-radius: 12px;
  font-size: 14px; font-family: inherit;
  background: #EFEEEA; color: var(--text);
  box-shadow: var(--inset);
  outline: none;
}
.weight-entry input:focus { border-color: var(--yellow); }
.weight-chart-box { margin-top: 8px; }
.weight-stats { font-size: 12px; color: var(--text-soft); margin-bottom: 8px; }
.weight-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}

/* ===== Calendar ===== */
.cal-nav-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: #F1F0ED;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-size: 14px; font-weight: 800;
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.cal-nav-btn:hover { background: var(--yellow-light); }
.cal-nav-btn:active { background: var(--yellow); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-cell {
  aspect-ratio: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding-top: 4px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px; font-weight: 700;
  color: var(--text);
  transition: all 0.12s;
  position: relative;
  min-width: 0;
  gap: 2px;
}
.cal-cell:hover { background: rgba(255,255,255,0.55); }
.cal-cell:active { background: rgba(255,218,128,0.45); }
.cal-dow {
  font-size: 12px; color: var(--text-soft);
  font-weight: 800; cursor: default;
  aspect-ratio: unset; padding: 4px 0;
}
.cal-dow:hover { background: transparent; }
.cal-empty { cursor: default; background: transparent; }
.cal-empty:hover { background: transparent; }
.cal-today {
  background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%);
  color: #7A5C00;
  box-shadow: 0 5px 12px rgba(255,196,0,0.35);
}
.cal-day { line-height: 1; }
.cal-weight {
  font-size: 11px; font-weight: 700;
  color: #D4A82E;
  margin-top: 6px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.cal-has { background: rgba(255,255,255,0.55); }

/* ===== History calendar ===== */
.cal-done-count {
  font-size: 10px; font-weight: 700;
  color: var(--text-soft);
  margin-top: 4px;
  line-height: 1;
}
.cal-cell.hist-all { background: #E8F5E9; }
.cal-cell.hist-all.cal-today { background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%); box-shadow: 0 5px 12px rgba(255,196,0,0.35); }
.cal-cell.hist-all .cal-done-count { color: var(--done); }
.cal-cell.hist-partial { background: #FFF9C4; }
.cal-cell.hist-partial.cal-today { background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%); box-shadow: 0 5px 12px rgba(255,196,0,0.35); }
.hist-legend {
  display: flex; gap: 14px; justify-content: center;
  margin-top: 8px; font-size: 11px; color: var(--text-soft); font-weight: 700;
}
.hist-legend-item { display: flex; align-items: center; gap: 5px; }
.hist-legend-dot { width: 10px; height: 10px; border-radius: 3px; }
.cal-modal.hist-modal { max-width: 440px; max-height: 80vh; overflow-y: auto; }
.hist-task-row {
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
}
.hist-task-row:last-child { border-bottom: none; }
.hist-task-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700;
}
.hist-task-head svg { width: 16px; height: 16px; }
.hist-edit-row {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  margin-top: 4px; margin-left: 24px;
}
.hist-edit-row input {
  font-size: 12px; padding: 4px 8px;
  border: 1px solid var(--line); border-radius: 8px;
}
.hist-edit-row .btn { font-size: 11px; padding: 4px 10px; }
.hist-note-row { margin: 2px 0 4px 24px; }
.hist-note-row input {
  width: 100%; font-size: 11px; padding: 4px 8px;
  border: 1px solid var(--line); border-radius: 8px;
}

/* ===== Period circle ===== */
.cal-period-circle {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
  color: #FFF;
  margin-top: 0px;
  line-height: 1;
  align-self: center;
}
.cal-period-circle.actual { background: #EC407A; }
.cal-period-circle.predict { background: #FFB3D9; }
.cal-period-circle.ovulation { background: rgba(196,181,253,0.7); color: #FFF; }
.cal-period-circle.today { background: rgba(186,219,255,0.7); color: #FFF; }
.cal-period-circle.plain { background: transparent; color: var(--text); }
.cal-period-cell { background: transparent; }
.cal-period-grid-cell { justify-content: center; padding-top: 0; }

/* ===== Period legend ===== */
.period-legend {
  display: flex; gap: 14px; justify-content: center;
  margin-top: 8px; font-size: 11px; color: var(--text-soft); font-weight: 700;
}
.period-legend-item { display: flex; align-items: center; gap: 5px; }
.period-legend-dot { width: 14px; height: 14px; border-radius: 50%; }
.period-legend-dot.actual { background: #EC407A; }
.period-legend-dot.predict { background: #FFB3D9; }
.period-legend-dot.ovulation { background: rgba(196,181,253,0.7); }
.period-legend-dot.today { background: rgba(186,219,255,0.7); }

/* ===== Calendar Modal ===== */
.cal-modal-mask {
  position: fixed; inset: 0;
  background: rgba(80,76,68,0.35);
  display: none;
  align-items: center; justify-content: center;
  z-index: 150;
  padding: 20px;
}
.cal-modal-mask.show { display: flex; animation: fadeIn 0.2s; }
.cal-modal {
  background: linear-gradient(145deg, #F8F7F4 0%, #F0EEE9 100%);
  border: none;
  border-radius: 22px;
  padding: 20px;
  width: 100%; max-width: 380px;
  box-shadow: 0 20px 50px rgba(90,84,70,0.25), 0 0 0 1px rgba(255,255,255,0.6) inset;
  animation: slideUp 0.25s cubic-bezier(0.34,1.56,0.64,1);
}

/* ===== Settings panel ===== */
.setting-row { margin-bottom: 14px; }
.setting-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: block; }
.setting-input {
  width: 100%; padding: 10px 14px;
  border: none;
  border-radius: 12px;
  font-family: inherit; font-size: 13px;
  background: #EFEEEA; color: var(--text);
  box-shadow: var(--inset);
  outline: none;
}
.setting-input:focus { border-color: var(--yellow); }
.setting-hint { font-size: 11px; color: var(--text-soft); margin-top: 4px; line-height: 1.5; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: linear-gradient(135deg, #FDEBC8, #FFDA80); color: #6E5500;
  padding: 10px 20px;
  border-radius: 16px;
  font-size: 14px; font-weight: 700;
  z-index: 200;
  box-shadow: 0 10px 24px rgba(255,196,0,0.35);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--yellow-light); border-radius: 5px; }

/* ===== Mobile burger ===== */
.burger { display: none; position: fixed; top: 12px; left: 12px; z-index: 50;
  width: 36px; height: 36px; background: linear-gradient(135deg, #FFF9DE 0%, #FDEBC8 38%, #FFDA80 76%, #FDC94E 100%); border: none;
  border-radius: 10px; font-size: 18px; cursor: pointer;
  box-shadow: 0 5px 12px rgba(255,196,0,0.35); color: #7A5C00; font-weight: 900;
}
.sidebar-overlay { display: none; }

@media (max-width: 700px) {
  .app { position: relative; }
  .sidebar {
    position: fixed; left: -260px; top: 0; bottom: 0;
    transition: left 0.25s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    z-index: 45;
    padding-top: 56px;
  }
  .sidebar.open { left: 0; }
  .sidebar-overlay {
    display: block;
    position: fixed; inset: 0;
    background: rgba(90,56,0,0.4);
    z-index: 40;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
  .burger { display: block; }
  /* 侧边栏打开时隐藏菜单按钮，避免遮挡侧边栏内容 */
  body.sidebar-open .burger { opacity: 0; pointer-events: none; }
  .main { padding: 64px 12px 16px; }
}

/* ===== Empty state ===== */
.empty-state { text-align: center; padding: 30px; color: var(--text-soft); font-size: 14px; }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 8px; opacity: 0.4; }
</style>
</head>
<body>

<div class="app">
  <!-- Burger for mobile -->
  <button class="burger" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="side-logo" onclick="openPanel('welcome')" style="cursor:pointer;" title="点击回到首页">
      <div class="side-logo-icon">S</div>

        <div class="side-title">Sunny</div>

      </div>
    </div>

      <div class="side-progress-txt" id="sideProgressTxt">0 / 7</div>
    </div>

    <div id="sideTasks"></div>
    <div class="side-spacer"></div>
    <div class="side-nav" id="sideNav"></div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <div class="welcome" id="welcomePanel">
      <div style="font-size:56px;margin-bottom:12px;">☼</div>

    <div class="main-panel" id="panel-history"></div>
    <div class="main-panel" id="panel-weight"></div>
    <div class="main-panel" id="panel-period"></div>
    <div class="main-panel" id="panel-stats"></div>
    <div class="main-panel" id="panel-settings"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== ICONS ====================
const ICONS = {

  music:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18V5l12-3v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="15" r="3"/></svg>`,

};

const TASKS = [
  { id: 'pullup',   name: '引体向上',     color: '#FF8A65', inputType: 'number', inputLabel: '完成个数', unit: '个' },
  { id: 'meditate', name: '冥想',         color: '#9575CD', inputType: 'number', inputLabel: '冥想时长', unit: '分钟' },
  { id: 'startup',  name: '线上创业',     color: '#4FC3F7', inputType: 'text',  inputLabel: '今日进展', unit: '' },
  { id: 'music',    name: '个人音乐',     color: '#F06292', inputType: 'text',  inputLabel: '练习/创作内容', unit: '' },
  { id: 'soft',     name: '柔软时刻小程序', color: '#26C6DA', inputType: 'text',  inputLabel: '今日进展/记录', unit: '' },
  { id: 'weight',   name: '记录体重',     color: '#66BB6A', inputType: 'number', inputLabel: '今日体重', unit: 'kg' },
  { id: 'stock',    name: '股票分析',     color: '#FFA726', inputType: 'text',  inputLabel: '分析/操作记录', unit: '' }
];

const STORAGE_KEY = 'sunny_workbench_v2';
const SUPA_KEY = 'sunny_supa_config';

let state = { days: {}, weightLog: [], periodLog: [], periodSettings: { cycle: 28, duration: 5 }, settings: { remindTime: '09:00' } };
let supaConfig = { url: '', key: '' };
let currentPanel = 'welcome';

// ==================== Storage ====================
function todayKey() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function getDay(dk) {
  if (!state.days[dk]) state.days[dk] = {};
  return state.days[dk];
}

function isDayDone(dk) {
  const d = getDay(dk);
  return TASKS.every(t => d[t.id] && d[t.id].done);
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.days = p.days || {};
      state.weightLog = p.weightLog || [];
      state.periodLog = p.periodLog || [];
      state.periodSettings = Object.assign(state.periodSettings, p.periodSettings || {});
      state.settings = Object.assign(state.settings, p.settings || {});
    }
  } catch(e) {}
  try {
    const sc = localStorage.getItem(SUPA_KEY);
    if (sc) supaConfig = JSON.parse(sc);
  } catch(e) {}
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ==================== Supabase ====================
async function syncToSupa() {
  if (!supaConfig.url) return;
  const url = supaConfig.url.replace(/\/$/,'') + '/rest/v1/sunny_data';
  const payload = JSON.stringify({ id: 'main', data: JSON.stringify(state), updated_at: new Date().toISOString() });
  try {
    await fetch(url + '?id=eq.main', {
      method: 'PATCH',
      headers: { 'apikey': supaConfig.key, 'Authorization': 'Bearer '+supaConfig.key, 'Content-Type': 'application/json' },
      body: payload
    });
  } catch(e) {}
}

async function pullFromSupa() {
  if (!supaConfig.url) return false;
  try {
    const r = await fetch(supaConfig.url.replace(/\/$/,'') + '/rest/v1/sunny_data?id=eq.main&select=data', {
      headers: { 'apikey': supaConfig.key, 'Authorization': 'Bearer '+supaConfig.key }
    });
    const j = await r.json();
    if (j && j.length && j[0].data) {
      const remote = JSON.parse(j[0].data);
      remote.days = remote.days || {};
      Object.keys(remote.days).forEach(k => { if (!state.days[k]) state.days[k] = remote.days[k]; });
      if (Array.isArray(remote.weightLog)) {
        const exist = new Set(state.weightLog.map(w=>w.date));
        remote.weightLog.forEach(w => { if (!exist.has(w.date)) state.weightLog.push(w); });
        state.weightLog.sort((a,b)=>a.date.localeCompare(b.date));
      }
      if (Array.isArray(remote.periodLog)) {
        const existP = new Set(state.periodLog.map(p=>p.date));
        remote.periodLog.forEach(p => { if (!existP.has(p.date)) state.periodLog.push(p); });
        state.periodLog.sort((a,b)=>a.date.localeCompare(b.date));
      }
      if (remote.periodSettings) state.periodSettings = Object.assign(state.periodSettings, remote.periodSettings);
      saveLocal();
      return true;
    }
  } catch(e) {}
  return false;
}

async function testSupa() {
  const url = document.getElementById('supaUrl').value.trim();
  const key = document.getElementById('supaKey').value.trim();
  if (!url || !key) { toast('请填写 URL 和 key'); return; }
  document.getElementById('supaStatus').textContent = '测试中...';
  const fullUrl = url.replace(/\/$/,'') + '/rest/v1/sunny_data?select=id&limit=1';
  try {
    const r = await fetch(fullUrl, {
      method: 'GET',
      headers: {
        'apikey': key,
        'Authorization': 'Bearer '+key,
        'Content-Type': 'application/json'
      }
    });
    if (r.status === 404 || r.status === 400) {
      document.getElementById('supaStatus').innerHTML = '提示：需建表。请到 Supabase SQL Editor 执行建表代码';
    } else if (r.ok) {
      document.getElementById('supaStatus').textContent = '✓ 连接成功！';
      supaConfig = { url, key };
      localStorage.setItem(SUPA_KEY, JSON.stringify(supaConfig));
    } else if (r.status === 401) {
      document.getElementById('supaStatus').textContent = '失败：key 不正确（401）';
    } else {
      const txt = await r.text().catch(()=> '');
      document.getElementById('supaStatus').textContent = '失败：HTTP ' + r.status + ' ' + txt.slice(0,80);
    }
  } catch(e) {
    document.getElementById('supaStatus').textContent = '失败：' + e.name + ' - ' + e.message + ' | URL: ' + fullUrl.slice(0,50);
  }
}

function saveSupa() {
  supaConfig.url = document.getElementById('supaUrl').value.trim();
  supaConfig.key = document.getElementById('supaKey').value.trim();
  localStorage.setItem(SUPA_KEY, JSON.stringify(supaConfig));
  toast('已保存配置');
}

async function syncNow() {
  if (!supaConfig.url) { toast('请先配置 Supabase'); return; }
  toast('同步中...');
  await syncToSupa();
  await pullFromSupa();
  render();
  toast('同步完成');
}

// ==================== Render ====================
function render() {

}

    </div>

    { id: 'weight-track', label: '体重追踪', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>` },
    { id: 'stats', label: '数据看板', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 3 2 5-7"/></svg>` },
    { id: 'settings', label: '设置', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>` },
  ];
  const nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  navItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'side-nav-item' + (currentPanel === item.id ? ' active' : '');

function openTask(id) {
  currentPanel = id;
  render();
  closeSidebar();
}

function openPanel(id) {
  currentPanel = id;
  render();
  closeSidebar();
}

function renderCurrentPanel() {
  const wp = document.getElementById('welcomePanel');
  wp.style.display = (currentPanel === 'welcome') ? 'flex' : 'none';

  // Hide all task panels
  const tp = document.getElementById('taskPanels');
  tp.innerHTML = '';
  TASKS.forEach(t => {
    const div = document.createElement('div');
    div.className = 'main-panel' + (currentPanel === t.id ? ' active' : '');
    div.id = 'taskPanel-' + t.id;
    tp.appendChild(div);
  });
  if (TASKS.some(t => t.id === currentPanel)) {
    renderTaskPanel(currentPanel);
  }

  // Special panels
  const special = {
    'history': 'panel-history',
    'weight-track': 'panel-weight',
    'period-track': 'panel-period',
    'stats': 'panel-stats',
    'settings': 'panel-settings'
  };
  Object.keys(special).forEach(id => {
    const panel = document.getElementById(special[id]);
    panel.className = 'main-panel' + (currentPanel === id ? ' active' : '');
  });
  if (currentPanel === 'history') renderHistoryPanel();
  if (currentPanel === 'weight-track') renderWeightPage();
  if (currentPanel === 'period-track') renderPeriodPage();
  if (currentPanel === 'stats') renderStatsPanel();
  if (currentPanel === 'settings') renderSettingsPanel();
}

function renderTaskPanel(id) {
  const t = TASKS.find(t => t.id === id);
  if (!t) return;
  const panel = document.getElementById('taskPanel-'+id);
  const tk = todayKey();
  const day = getDay(tk);
  const rec = day[id] || { done: false, value: '', note: '' };

  panel.innerHTML = `
    <div class="panel-header">
      <div class="panel-icon" style="background:${t.color}22;color:${t.color};">${ICONS[t.id]}</div>
      <div>
        <div class="panel-title">${t.name}</div>
        <div class="panel-sub">${t.inputLabel} ${rec.value ? '· 已记录: '+rec.value+(t.unit||'') : ''}</div>
      </div>
    </div>
    <div class="panel-body">
      <div class="task-detail-card">
        <label>${t.inputLabel}</label>
        <input type="${t.inputType}" id="taskInput_${id}" value="${rec.value||''}" placeholder="${t.inputLabel}（${t.unit}）">
        <label style="margin-top:12px;">备注</label>
        <textarea id="taskNote_${id}" placeholder="可选备注...">${rec.note||''}</textarea>
        <div class="btn-row">
          ${rec.done
            ? `<button class="btn undo-btn" onclick="undoTask('${id}')">撤销完成</button>`
            : `<button class="btn done-btn" onclick="markDone('${id}')">标记完成 ✓</button>`
          }
          <button class="btn" onclick="saveTask('${id}')">保存记录</button>
        </div>
      </div>
    </div>
  `;
}

function markDone(id) {
  const day = getDay(todayKey());
  if (!day[id]) day[id] = { done: false, value: '', note: '' };
  day[id].done = true;
  day[id].ts = Date.now();
  const inp = document.getElementById('taskInput_'+id);
  if (inp && inp.value) day[id].value = inp.value;
  const note = document.getElementById('taskNote_'+id);
  if (note && note.value) day[id].note = note.value;
  saveLocal(); syncToSupa();
  toast('✓ 完成 ' + TASKS.find(t=>t.id===id).name);
  render();
}

function undoTask(id) {
  const day = getDay(todayKey());
  if (day[id]) day[id].done = false;
  saveLocal(); syncToSupa();
  render();
}

function saveTask(id) {
  const day = getDay(todayKey());
  if (!day[id]) day[id] = { done: false, value: '', note: '' };
  day[id].value = document.getElementById('taskInput_'+id).value;
  day[id].note = document.getElementById('taskNote_'+id).value;
  day[id].ts = Date.now();
  // Sync weight to weightLog
  if (id === 'weight' && day[id].value) {
    const v = parseFloat(day[id].value);
    if (!isNaN(v)) {
      const tk = todayKey();
      state.weightLog = state.weightLog.filter(w => w.date !== tk);
      state.weightLog.push({ date: tk, value: v, note: day[id].note || '', ts: Date.now() });
      state.weightLog.sort((a,b) => a.date.localeCompare(b.date));
    }
  }
  saveLocal(); syncToSupa();
  toast('已保存');
  render();
}

// ==================== History ====================
let hCalYear, hCalMonth;
let histEditingDate = '';

function renderHistoryPanel() {
  const panel = document.getElementById('panel-history');
  const now = new Date();
  if (!hCalYear) { hCalYear = now.getFullYear(); hCalMonth = now.getMonth() + 1; }

  let html = `<div class="panel-header"><div style="font-size:28px;">☼</div><div><div class="panel-title">历史记录</div><div class="panel-sub">点击日期查看详情或补打卡</div></div></div><div class="panel-body">`;

  // --- Calendar ---
  html += `<div class="task-detail-card" style="padding:12px 16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <button class="cal-nav-btn" onclick="hCalShift(-1)">◀</button>
      <span style="font-size:15px;font-weight:800;color:var(--text);">${hCalYear}年${hCalMonth}月</span>
      <button class="cal-nav-btn" onclick="hCalShift(1)">▶</button>
    </div>
    <div class="cal-grid">${renderHistoryCalendar()}</div>
    <div class="hist-legend">
      <div class="hist-legend-item"><span class="hist-legend-dot" style="background:#E8F5E9;border:1px solid var(--done);"></span>全完成</div>
      <div class="hist-legend-item"><span class="hist-legend-dot" style="background:var(--yellow-light);"></span>部分完成</div>
      <div class="hist-legend-item"><span class="hist-legend-dot" style="background:#FFF;border:1px solid var(--line);"></span>未记录</div>
    </div>
  </div>`;

  // --- Modal ---
  html += `<div class="cal-modal-mask" id="hCalModal" onclick="closeHistModal(event)">
    <div class="cal-modal hist-modal" onclick="event.stopPropagation()">
      <div style="font-size:15px;font-weight:800;margin-bottom:12px;">打卡详情 · <span id="hCalModalDate"></span></div>
      <div id="hCalModalBody"></div>
    </div>
  </div>`;

  html += `</div>`;
  panel.innerHTML = html;
}

function renderHistoryCalendar() {
  const year = hCalYear, month = hCalMonth;
  const firstDay = new Date(year, month-1, 1);
  const lastDay = new Date(year, month, 0);
  const startDow = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = todayKey();

  const dow = ['日','一','二','三','四','五','六'];
  let html = '';
  dow.forEach(d => { html += `<div class="cal-cell cal-dow">${d}</div>`; });

  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell cal-empty"></div>`;

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === today;
    const day = state.days[dateStr];
    const hasData = day && Object.keys(day).some(k => day[k] && day[k].done);
    let doneCount = 0;
    let cls = '';
    if (day) {
      doneCount = TASKS.filter(t => day[t.id] && day[t.id].done).length;
      if (doneCount === TASKS.length) cls = ' hist-all';
      else if (doneCount > 0) cls = ' hist-partial';
    }
    const todayCls = isToday ? ' cal-today' : '';
    html += `<div class="cal-cell${cls}${todayCls}" onclick="openHistCalDay('${dateStr}')">
      <span class="cal-day">${d}</span>
      ${hasData ? `<span class="cal-done-count">${doneCount}/${TASKS.length}</span>` : ''}
    </div>`;
  }
  return html;
}

function hCalShift(dir) {
  hCalMonth += dir;
  if (hCalMonth > 12) { hCalMonth = 1; hCalYear++; }
  if (hCalMonth < 1) { hCalMonth = 12; hCalYear--; }
  renderHistoryPanel();
}

function openHistCalDay(dateStr) {
  histEditingDate = dateStr;
  document.getElementById('hCalModalDate').textContent = dateStr;
  renderHistModalBody(dateStr);
  document.getElementById('hCalModal').classList.add('show');
}

function closeHistModal(e) {
  if (e && e.target !== document.getElementById('hCalModal')) return;
  document.getElementById('hCalModal').classList.remove('show');
  histEditingDate = '';
  // Re-render calendar to reflect changes
  renderHistoryPanel();
}

function renderHistModalBody(dk) {
  const body = document.getElementById('hCalModalBody');
  if (!body) return;
  const day = state.days[dk] || {};
  const doneCount = TASKS.filter(t => day[t.id] && day[t.id].done).length;
  let html = `<div style="font-size:12px;color:var(--text-soft);margin-bottom:10px;font-weight:700;">完成 ${doneCount}/${TASKS.length}</div>`;
  TASKS.forEach(t => {
    const rec = day[t.id] || { done: false, value: '', note: '' };
    html += `<div class="hist-task-row">
      <div class="hist-task-head">
        <span style="color:${t.color}">${ICONS[t.id]}</span>
        <span style="flex:1;color:${rec.done?'var(--text)':'var(--text-soft)'};${rec.done?'':'text-decoration:line-through;'}">${t.name}</span>
        ${rec.value ? `<span style="color:var(--yellow-deep);font-size:12px;">${rec.value}${t.unit||''}</span>` : ''}
        <span style="color:${rec.done?'var(--done)':'var(--text-soft)'};font-size:14px;">${rec.done?'✓':'—'}</span>
      </div>
      <div class="hist-edit-row">
        <input type="${t.inputType}" value="${rec.value||''}" placeholder="${t.inputLabel}" style="flex:1;min-width:80px;" id="histIn_${dk}_${t.id}">
        <button class="btn" onclick="histToggleDone('${dk}','${t.id}')" style="${rec.done?'background:var(--text-soft);':'background:var(--done);'}color:#FFF;">${rec.done?'撤销':'补打卡'}</button>
        <button class="btn" onclick="histSave('${dk}','${t.id}')" style="background:var(--yellow);color:#8B6914;">保存</button>
      </div>
      <div class="hist-note-row">
        <input type="text" value="${rec.note||''}" placeholder="备注（可选）" id="histNote_${dk}_${t.id}">
      </div>
    </div>`;
  });
  body.innerHTML = html;
}

function histToggleDone(dk, tid) {
  if (!state.days[dk]) state.days[dk] = {};
  if (!state.days[dk][tid]) state.days[dk][tid] = { done: false, value: '', note: '' };
  state.days[dk][tid].done = !state.days[dk][tid].done;
  state.days[dk][tid].ts = Date.now();
  saveLocal(); syncToSupa();
  renderHistModalBody(dk);
  renderSidebar();
}

function histSave(dk, tid) {
  if (!state.days[dk]) state.days[dk] = {};
  if (!state.days[dk][tid]) state.days[dk][tid] = { done: false, value: '', note: '' };
  const inp = document.getElementById('histIn_'+dk+'_'+tid);
  const noteInp = document.getElementById('histNote_'+dk+'_'+tid);
  if (inp) state.days[dk][tid].value = inp.value;
  if (noteInp) state.days[dk][tid].note = noteInp.value;
  state.days[dk][tid].ts = Date.now();
  // Sync weight to weightLog
  if (tid === 'weight' && state.days[dk][tid].value) {
    const v = parseFloat(state.days[dk][tid].value);
    if (!isNaN(v)) {
      state.weightLog = state.weightLog.filter(w => w.date !== dk);
      state.weightLog.push({ date: dk, value: v, note: state.days[dk][tid].note || '', ts: Date.now() });
      state.weightLog.sort((a,b) => a.date.localeCompare(b.date));
    }
  }
  saveLocal(); syncToSupa();
  renderHistModalBody(dk);
  toast('已保存 ' + dk + ' 的记录');
}

function computePeriodMap() {
  const map = {};
  const cycle = state.periodSettings.cycle || 28;
  const defaultDuration = state.periodSettings.duration || 5;
  const sorted = [...state.periodLog].sort((a,b) => a.date.localeCompare(b.date));

  // Calculate average cycle and duration from actual records
  let avgCycle = cycle;
  let avgDur = defaultDuration;
  if (sorted.length >= 2) {
    const gaps = [];
    for (let i = 1; i < sorted.length; i++) {
      const d1 = new Date(sorted[i-1].date + 'T00:00:00');
      const d2 = new Date(sorted[i].date + 'T00:00:00');
      gaps.push(Math.round((d2 - d1) / 86400000));
    }
    avgCycle = Math.round(gaps.reduce((a,b)=>a+b,0) / gaps.length);
  }
  const actualDurs = sorted.map(p => {
    if (p.endDate) {
      return Math.round((new Date(p.endDate+'T00:00:00') - new Date(p.date+'T00:00:00')) / 86400000) + 1;
    }
    return defaultDuration;
  }).filter(d => d > 0);
  if (actualDurs.length) avgDur = Math.round(actualDurs.reduce((a,b)=>a+b,0) / actualDurs.length);

  const today = new Date(todayKey() + 'T00:00:00');

  // Mark actual period days and predict future periods
  const futurePeriods = [];
  sorted.forEach(p => {
    const start = new Date(p.date + 'T00:00:00');
    let dur = p.endDate
      ? Math.round((new Date(p.endDate+'T00:00:00') - start) / 86400000) + 1
      : defaultDuration;
    for (let i = 0; i < dur; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      map[key] = { type: 'actual', startDate: p.date };
    }
    // predict this cycle's future period
    futurePeriods.push({ start: new Date(start), dur, offset: 0 });
  });

  // Predict upcoming cycles: keep predicting from last start until we cover today and beyond (max 3 shown)
  if (sorted.length > 0) {
    const lastStart = new Date(sorted[sorted.length-1].date + 'T00:00:00');
    let added = 0;
    for (let c = 1; c <= 12 && added < 3; c++) {
      const predStart = new Date(lastStart.getTime() + avgCycle * c * 86400000);
      const predEnd = new Date(predStart.getTime() + (avgDur - 1) * 86400000);
      // Show this predicted cycle as long as it hasn't fully passed (end >= today)
      if (predEnd >= today) {
        futurePeriods.push({ start: predStart, dur: avgDur, offset: c });
        added++;
      }
    }
  }

  futurePeriods.forEach(fp => {
    for (let i = 0; i < fp.dur; i++) {
      const d = new Date(fp.start); d.setDate(d.getDate() + i);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if (!map[key]) map[key] = { type: fp.offset === 0 && fp.start <= today ? 'actual' : 'predict', startDate: key };
    }
    // Ovulation: typically 14 days before next period, window +/- 4 days
    const ovuCenter = new Date(fp.start);
    ovuCenter.setDate(ovuCenter.getDate() - 14);
    for (let i = -3; i <= 3; i++) {
      const d = new Date(ovuCenter); d.setDate(d.getDate() + i);
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if (!map[key]) map[key] = { type: 'ovulation', startDate: key };
    }
  });

  return map;
}

function renderPeriodCalendar(periodMap) {
  const year = pCalYear, month = pCalMonth;
  const firstDay = new Date(year, month-1, 1);
  const lastDay = new Date(year, month, 0);
  const startDow = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = todayKey();

  const dow = ['日','一','二','三','四','五','六'];
  let html = '';
  dow.forEach(d => { html += `<div class="cal-cell cal-dow">${d}</div>`; });

  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell cal-empty"></div>`;

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === today;
    const pInfo = periodMap[dateStr];

    let inner = '';
    let cls = 'cal-cell cal-period-grid-cell';

    if (isToday && pInfo) {
      inner = `<span class="cal-period-circle ${pInfo.type}">${d}</span>`;
    } else if (isToday) {
      inner = `<span class="cal-period-circle today">${d}</span>`;
    } else if (pInfo) {
      inner = `<span class="cal-period-circle ${pInfo.type}">${d}</span>`;
    } else {
      inner = `<span class="cal-period-circle plain">${d}</span>`;
    }

    html += `<div class="${cls}" onclick="openPCalDay('${dateStr}')">${inner}</div>`;
  }
  return html;
}

function pCalShift(dir) {
  pCalMonth += dir;
  if (pCalMonth > 12) { pCalMonth = 1; pCalYear++; }
  if (pCalMonth < 1) { pCalMonth = 12; pCalYear--; }
  renderPeriodPage();
}

function pCalJumpTo(dateStr) {
  if (!dateStr) return;
  const [y,m] = dateStr.split('-');
  pCalYear = parseInt(y); pCalMonth = parseInt(m);
  renderPeriodPage();
}

let pCalEditingDate = '';

function openPCalDay(dateStr) {
  pCalEditingDate = dateStr;
  document.getElementById('pCalModalDate').textContent = dateStr;
  const existing = state.periodLog.find(p => p.date === dateStr);
  if (existing) {
    document.getElementById('pCalDelBtn').style.display = 'inline-block';
  } else {
    document.getElementById('pCalDelBtn').style.display = 'none';
  }
  document.getElementById('pCalModal').classList.add('show');
}

function closePCalModal(e) {
  if (e && e.target !== document.getElementById('pCalModal')) return;
  document.getElementById('pCalModal').classList.remove('show');
  pCalEditingDate = '';
}

function markPeriodStart() {
  if (!pCalEditingDate) return;
  const existing = state.periodLog.find(p => p.date === pCalEditingDate);
  if (!existing) {
    state.periodLog.push({ date: pCalEditingDate, ts: Date.now() });
    state.periodLog.sort((a,b) => a.date.localeCompare(b.date));
  }
  saveLocal(); syncToSupa();
  document.getElementById('pCalModal').classList.remove('show');
  renderPeriodPage();
  toast('已标记 ' + pCalEditingDate + ' 经期开始');
}

function markPeriodEnd() {
  if (!pCalEditingDate) return;
  // Find the most recent period start that is on or before this date
  const sorted = [...state.periodLog].sort((a,b) => b.date.localeCompare(a.date));
  const startRec = sorted.find(p => p.date <= pCalEditingDate);
  if (!startRec) {
    toast('请先标记经期开始日期');
    return;
  }
  // Set endDate on the start record
  startRec.endDate = pCalEditingDate;
  saveLocal(); syncToSupa();
  document.getElementById('pCalModal').classList.remove('show');
  renderPeriodPage();
  toast('已标记 ' + pCalEditingDate + ' 经期结束');
}

function deletePeriod() {
  if (!confirm('删除 ' + pCalEditingDate + ' 的经期开始记录？')) return;
  state.periodLog = state.periodLog.filter(p => p.date !== pCalEditingDate);
  saveLocal(); syncToSupa();
  document.getElementById('pCalModal').classList.remove('show');
  renderPeriodPage();
  toast('已删除');
}

function addPeriodFromQuick(type) {
  const date = document.getElementById('periodDate').value;
  if (!date) { toast('请选择日期'); return; }
  if (type === 'start') {
    const existing = state.periodLog.find(p => p.date === date);
    if (!existing) {
      state.periodLog.push({ date, ts: Date.now() });
      state.periodLog.sort((a,b) => a.date.localeCompare(b.date));
    }
    saveLocal(); syncToSupa();
    pCalYear = parseInt(date.split('-')[0]); pCalMonth = parseInt(date.split('-')[1]);
    renderPeriodPage();
    toast('已标记 ' + date + ' 经期开始');
  } else if (type === 'end') {
    const sorted = [...state.periodLog].sort((a,b) => b.date.localeCompare(a.date));
    const startRec = sorted.find(p => p.date <= date);
    if (!startRec) {
      toast('请先标记经期开始日期');
      return;
    }
    startRec.endDate = date;
    saveLocal(); syncToSupa();
    pCalYear = parseInt(date.split('-')[0]); pCalMonth = parseInt(date.split('-')[1]);
    renderPeriodPage();
    toast('已标记 ' + date + ' 经期结束');
  }
}

function updatePeriodSettings() {
  const c = parseInt(document.getElementById('cycleDays').value);
  const d = parseInt(document.getElementById('durationDays').value);
  if (c >= 15 && c <= 45) state.periodSettings.cycle = c;
  if (d >= 2 && d <= 10) state.periodSettings.duration = d;
  saveLocal(); syncToSupa();
  renderPeriodPage();
  toast('已更新周期设置');
}

function renderCalendar(wMap) {
  const year = calYear, month = calMonth;
  const firstDay = new Date(year, month-1, 1);
  const lastDay = new Date(year, month, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const totalDays = lastDay.getDate();
  const today = todayKey();

  const dow = ['日','一','二','三','四','五','六'];
  let html = '';
  dow.forEach(d => { html += `<div class="cal-cell cal-dow">${d}</div>`; });

  // Empty cells before first day
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell cal-empty"></div>`;

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const val = wMap[dateStr];
    const isToday = dateStr === today;
    const cls = isToday ? ' cal-today' : '';
    const hasWeight = val !== undefined ? ' cal-has' : '';
    html += `<div class="cal-cell${cls}${hasWeight}" onclick="openCalDay('${dateStr}',${val||0},${val!==undefined})">
      <span class="cal-day">${d}</span>
      ${val !== undefined ? `<span class="cal-weight">${val}</span>` : ''}
    </div>`;
  }
  return html;
}

function calShift(dir) {

}

function addWeightFromQuick() {

function drawWeightLineChart(data) {
  const container = document.getElementById('weightLineChart');
  if (!container) return;
  document.getElementById('weightEmpty').style.display = 'none';
  const W = Math.min(container.parentElement.clientWidth - 36, 580);
  const H = 190;
  const padL = 40, padR = 12, padT = 16, padB = 26;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const vals = data.map(d => d.value);
  let minV = Math.min(...vals), maxV = Math.max(...vals);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const pad = (maxV-minV)*0.15;
  minV -= pad; maxV += pad;
  const range = maxV - minV;
  const n = data.length;
  const xStep = n > 1 ? innerW/(n-1) : 0;
  const xPos = i => padL + (n>1?i*xStep:innerW/2);
  const yPos = v => padT + innerH - ((v-minV)/range)*innerH;

  let pathD='', areaD='';
  data.forEach((d,i) => {
    const x = xPos(i), y = yPos(d.value);
    pathD += (i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    if (i===0) areaD += 'M'+x.toFixed(1)+' '+(padT+innerH)+' L'+x.toFixed(1)+' '+y.toFixed(1)+' ';
    else areaD += 'L'+x.toFixed(1)+' '+y.toFixed(1)+' ';
    if (i===n-1) areaD += 'L'+x.toFixed(1)+' '+(padT+innerH)+' Z';
  });

  let grid='', yLabels='';
  for (let i=0;i<=3;i++) {
    const v = minV + range*i/3;
    const y = yPos(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>`;
    yLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-soft)" font-weight="600">${v.toFixed(1)}</text>`;
  }
  let xLabels='';
  const labelStep = Math.max(1, Math.ceil(n/7));
  data.forEach((d,i) => {
    if (i%labelStep===0 || i===n-1) {
      xLabels += `<text x="${xPos(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--text-soft)" font-weight="600">${d.date.slice(5)}</text>`;
    }
  });
  let dots='';
  data.forEach((d,i) => {
    const x = xPos(i), y = yPos(d.value);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#FFF" stroke="var(--yellow-deep)" stroke-width="2"/>`;
    if (i===n-1) {
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="var(--yellow)" opacity="0.35"/>`;
      dots += `<text x="${x.toFixed(1)}" y="${(y-10).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--yellow-deep)" font-weight="800">${d.value}</text>`;
    }
  });

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${grid}${yLabels}
    <defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--yellow)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--yellow-light)" stop-opacity="0.05"/></linearGradient></defs>
    <path d="${areaD}" fill="url(#wgrad)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="var(--yellow-deep)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xLabels}
  </svg>`;
}

function addWeight() {
  const date = document.getElementById('weightDate').value;
  const value = document.getElementById('weightValue').value;
  const note = document.getElementById('weightNote').value.trim();
  if (!date) { toast('请选择日期'); return; }
  if (!value || isNaN(parseFloat(value))) { toast('请输入体重数字'); return; }
  const v = parseFloat(value);
  state.weightLog = state.weightLog.filter(w => w.date !== date);
  state.weightLog.push({ date, value: v, note, ts: Date.now() });
  state.weightLog.sort((a,b) => a.date.localeCompare(b.date));
  if (date === todayKey()) {
    const day = getDay(todayKey());
    if (!day.weight) day.weight = { done: false, value: '', note: '' };
    day.weight.value = String(v); day.weight.done = true; day.weight.ts = Date.now();
  }
  saveLocal(); syncToSupa();
  document.getElementById('weightValue').value = '';
  document.getElementById('weightNote').value = '';
  renderWeightPage(); renderSidebar();
  toast('已记录 ' + date + ' 体重 ' + v + ' kg');
}

function deleteWeight(date) {
  if (!confirm('删除 ' + date + ' 的体重记录？')) return;
  state.weightLog = state.weightLog.filter(w => w.date !== date);
  saveLocal(); syncToSupa();
  renderWeightPage();
  toast('已删除');
}

// ==================== Stats ====================
function renderStatsPanel() {
  const panel = document.getElementById('panel-stats');
  const allDates = Object.keys(state.days);
  const totalDays = allDates.length;
  const allDoneDays = allDates.filter(d => isDayDone(d)).length;
  const today = todayKey();
  let streak = 0;
  let cur = new Date();
  while (true) {
    const k = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    if (state.days[k] && isDayDone(k)) { streak++; cur.setDate(cur.getDate()-1); }
    else break;
  }
  const month = today.slice(0,7);
  let pullupMonth = 0;
  Object.keys(state.days).forEach(k => {
    if (k.startsWith(month) && state.days[k].pullup && state.days[k].pullup.done) {
      pullupMonth += parseInt(state.days[k].pullup.value) || 0;
    }
  });
  const wLog = state.weightLog || [];
  const latestWeight = wLog.length ? wLog[wLog.length-1].value : null;

  let html = `<div class="panel-header"><div style="font-size:28px;">☼</div><div><div class="panel-title">数据看板</div></div></div><div class="panel-body">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${streak}</div><div class="stat-label">连续天数</div></div>
      <div class="stat-box"><div class="stat-num">${allDoneDays}</div><div class="stat-label">满分日数</div></div>
      <div class="stat-box"><div class="stat-num">${totalDays}</div><div class="stat-label">记录总天数</div></div>
      <div class="stat-box"><div class="stat-num">${latestWeight!==null?latestWeight:'—'}</div><div class="stat-label">最新体重(kg)</div></div>
    </div>
    <div class="task-detail-card">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px;">本周打卡热力</div>
      <div class="heat-row">`;
  const todayD = new Date();
  for (let i=6; i>=0; i--) {
    const d = new Date(todayD); d.setDate(d.getDate()-i);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const has = state.days[k];
    const done = has && isDayDone(k);
    const partial = has && !done;
    html += `<div class="heat-box" style="background:${done?'var(--done)':partial?'var(--yellow-light)':'var(--line)'};color:${done?'#FFF':'var(--text-soft)'};">${['日','一','二','三','四','五','六'][d.getDay()]}</div>`;
  }
  html += `</div></div></div>`;
  panel.innerHTML = html;
}

// ==================== Settings ====================
function renderSettingsPanel() {
  const panel = document.getElementById('panel-settings');
  panel.innerHTML = `<div class="panel-header"><div style="font-size:28px;">☼</div><div><div class="panel-title">设置</div></div></div><div class="panel-body">
    <div class="task-detail-card">
      <div style="font-size:14px;font-weight:800;margin-bottom:10px;">云端同步（Supabase）</div>
      <div class="setting-row"><label class="setting-label">Supabase URL</label><input type="text" class="setting-input" id="supaUrl" placeholder="https://xxx.supabase.co" value="${supaConfig.url||''}"></div>
      <div class="setting-row"><label class="setting-label">anon key</label><input type="text" class="setting-input" id="supaKey" placeholder="eyJxxx..." value="${supaConfig.key||''}"></div>
      <div class="setting-hint">留空则本地存储。去 supabase.com 创建项目获取。</div>
      <div class="btn-row">
        <button class="btn" onclick="saveSupa()">保存配置</button>
        <button class="btn ghost" onclick="testSupa()">测试连接</button>
        <button class="btn ghost" onclick="syncNow()">立即同步</button>
      </div>
      <div id="supaStatus" style="font-size:12px;margin-top:8px;color:var(--text-soft);"></div>
    </div>
    <div class="task-detail-card">
      <div style="font-size:14px;font-weight:800;margin-bottom:10px;">提醒时间</div>
      <div class="setting-row"><label class="setting-label">每日提醒时间</label><input type="time" class="setting-input" id="remindTime" value="${state.settings.remindTime||'09:00'}"></div>
      <button class="btn" onclick="enableNotify()">开启通知权限</button>
    </div>
    <div class="task-detail-card">
      <div style="font-size:14px;font-weight:800;margin-bottom:10px;">数据管理</div>
      <div class="btn-row">
        <button class="btn ghost" onclick="exportData()">导出数据</button>
        <button class="btn ghost" onclick="importData()">导入数据</button>
        <button class="btn ghost" onclick="clearAll()" style="color:#c00;">清空数据</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="doImport(event)">
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text-soft);padding:10px;">Sunny 工作台 v2.0 · 每一天都值得被阳光照亮</div>
  </div>`;
  // bind after render
  const rt = document.getElementById('remindTime');
  if (rt) rt.onchange = e => { state.settings.remindTime = e.target.value; saveLocal(); toast('提醒时间已更新'); };
}

// ==================== Sidebar toggle ====================
function toggleSidebar() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('sidebarOverlay');
  const opened = !s.classList.contains('open');
  s.classList.toggle('open');
  o.classList.toggle('show');
  document.body.classList.toggle('sidebar-open', opened);
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  document.body.classList.remove('sidebar-open');
}

// ==================== Toast ====================
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ==================== Data mgmt ====================
function exportData() {
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sunny-backup-'+todayKey()+'.json';
  a.click();
  toast('已导出');
}
function importData() { document.getElementById('importFile').click(); }
function doImport(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.days) Object.keys(data.days).forEach(k => { if (!state.days[k]) state.days[k] = data.days[k]; });
      if (Array.isArray(data.weightLog)) {
        const exist = new Set(state.weightLog.map(w=>w.date));
        data.weightLog.forEach(w => { if (!exist.has(w.date)) state.weightLog.push(w); });
        state.weightLog.sort((a,b)=>a.date.localeCompare(b.date));
      }
      if (Array.isArray(data.periodLog)) {
        const existP = new Set(state.periodLog.map(p=>p.date));
        data.periodLog.forEach(p => { if (!existP.has(p.date)) state.periodLog.push(p); });
        state.periodLog.sort((a,b)=>a.date.localeCompare(b.date));
      }
      if (data.periodSettings) state.periodSettings = Object.assign(state.periodSettings, data.periodSettings);
      saveLocal(); syncToSupa(); render(); toast('导入成功');
    } catch(err) { toast('导入失败：格式错误'); }
  };
  reader.readAsText(f);
}
function clearAll() {
  if (confirm('确定清空所有数据？此操作不可恢复。')) {
    state = { days: {}, weightLog: [], periodLog: [], periodSettings: state.periodSettings, settings: state.settings };
    saveLocal(); syncToSupa(); render(); toast('已清空');
  }
}

// ==================== Notifications ====================
async function enableNotify() {
  if (!('Notification' in window)) { toast('浏览器不支持通知'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    toast('通知已开启');
    new Notification('Sunny', { body: '通知已开启，每天会提醒你完成待办！' });
  } else { toast('未授权通知'); }
}
function checkReminder() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
  const cur = hh+':'+mm;
  const rt = state.settings.remindTime || '09:00';
  const today = todayKey();
  const remindKey = 'reminded_'+today+'_'+rt;
  if (cur === rt && !localStorage.getItem(remindKey)) {
    localStorage.setItem(remindKey, '1');
    const day = getDay(today);
    const doneCount = TASKS.filter(t => day[t.id] && day[t.id].done).length;
    if (doneCount < TASKS.length && Notification.permission === 'granted') {
      new Notification('Sunny 工作台', { body: '今天还有 '+(TASKS.length-doneCount)+' 项待办等你完成～' });
    }
  }
}

// ==================== Init ====================
async function init() {
  loadLocal();
  if (supaConfig.url) await pullFromSupa();
  render();
  checkReminder();
  setInterval(checkReminder, 30000);
}
init();
</script>
